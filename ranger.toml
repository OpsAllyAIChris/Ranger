# Ranger configuration.
#
# Secrets never live here. They live in .env, which is git-ignored.
# Paths, model names, hours and thresholds live here and nowhere else in the code.

[model]
# The provider seam. "anthropic" is the only implementation today.
provider = "anthropic"
# Never hardcoded anywhere in the source. Change it here.
name = "claude-sonnet-5"
# Adaptive thinking is on by default on current models and its tokens count
# against this, so leave headroom. Ranger's spoken replies are short; drafts
# are not.
max_tokens = 8192
# How hard the model thinks: low, medium, high, xhigh, max. This replaced
# temperature, which current models reject. Low keeps spoken replies snappy.
# Raise it when Ranger starts writing proposals. Empty string leaves it unset
# for older models that do not accept it.
effort = "low"
# Hard ceiling on tool-call rounds inside a single turn, so a confused
# model cannot loop forever.
max_tool_rounds = 6
# The network will drop. Ranger retries transient failures quietly and tells
# you in plain language when it gives up. Retries only happen before any of
# the reply has been spoken, so you never hear the first half twice.
timeout_seconds = 60.0
max_retries = 3
retry_backoff_seconds = 1.0
# Cache the stable half of the system prompt: persona, rules, tools, memory and
# the whole Knowledge folder. The clock sits in a second, uncached block after
# it, which is why it has been last in the prompt since Tier 1.
#
# Cached input is charged at about a tenth of the normal rate, so this is what
# makes the knowledge budget stop mattering. Watch cache_read_input_tokens in
# the turn timings: if it stays zero, something is changing the prefix.
cache_prompt = true
# Dollars per million tokens, for the running cost tally. Zero means show token
# counts and no money. Deliberately not hardcoded anywhere: prices change, and
# a stale number in the source would be worse than none. Copy them off the
# pricing page for whichever model is set above.
price_input = 0.0
price_output = 0.0
price_cache_write = 0.0
price_cache_read = 0.0
# How many past turns stay in the working transcript. Tier 4 replaces the
# spillover with durable memory.
history_turns = 24

[vault]
# Point this at the Obsidian vault. Ranger reads the whole vault and writes
# only under <root>/<ranger>. Override at runtime with RANGER_VAULT_ROOT.
# The 2TB external drive is a valid location; nothing assumes $HOME.
#
# Windows: forward slashes work, and so does ~. If you paste a path with
# backslashes, prefer single quotes, which stop TOML treating a backslash as an
# escape:
#     root = 'C:\Users\you\Obsidian\Ranger-Vault'
# Double quotes with single backslashes are accepted and normalised, with a
# warning at startup, because that form either fails to parse or silently
# mangles the path.
root = "~/Obsidian/Ranger-Vault"

# Read only. Ranger never writes to these.
accounts = "Accounts"
knowledge = "Knowledge"

# Ranger's own folder. Everything it persists lives under here.
ranger = "Ranger"
memory = "Ranger/memory"    # Tier 4, read + write
inbox = "Ranger/inbox"      # Tier 5, read + write
drafts = "Ranger/drafts"    # Tier 2, read + write
log = "Ranger/log"          # Tier 6, append only

[context]
# The whole standing allowance: memory plus knowledge, resent every turn.
# Account recall does not compete for this; it is a tool result, capped by
# [recall] instead.
#
# The real constraint is not the context window, which is far larger than this.
# It is that the system prompt is resent on every turn. Prompt caching is on
# (model.cache_prompt), so the stable half costs about a tenth after the first
# turn, which is what lets this be large. Raise it rather than splitting files.
budget_chars = 60000

[memory]
# Memory's guaranteed slice, taken before knowledge. When the two collide,
# knowledge loses: memory is small, it is about you, and nothing else records
# it, while a dropped knowledge file is recoverable and Ranger says which one
# it dropped.
reserve_chars = 8000
file = "facts.md"

[knowledge]
# Amendment C: company, products, ICP, competitive landscape and playbook are
# loaded whole as context. There is deliberately no budget here. Knowledge
# takes whatever is left of context.budget_chars once memory has its reserve,
# so there is one number to change rather than two that can disagree. There
# used to be two, and the smaller one won without saying so.
# Load ORDER only. Every .md in the folder is loaded whatever it is called;
# these just go first, so the most important survive when the budget bites.
# Nothing here is required and nothing is missing if you do not have it.
# Run 'ranger doctor' to see which files actually reach the model.
priority = ["company.md", "products.md", "icp.md", "competitors.md", "playbook.md"]

[schedule]
# One morning surface, everything else accumulates quietly.
# Local 24h clock. Validated at startup: morning_hour must sit outside the
# quiet window, and the quiet window must not be empty.
morning_hour = 7
quiet_start_hour = 18   # inclusive
quiet_end_hour = 6      # exclusive

[accounts]
# Tier 2 "what went quiet": accounts with no logged activity in more than
# this many days get surfaced.
quiet_after_days = 21
# Not account notes. Excluded from every scan.
exclude_files = ["_vault-build-report.md"]
# Notes carrying one of these statuses are set aside rather than reported.
# UNCONFIRMED notes came from the activity log and not the accounts export,
# and several are near-duplicates of real accounts.
skip_statuses = ["UNCONFIRMED"]
# The Tier vocabulary as it appears in the notes, best first. Nothing in the
# code knows what a tier is called. Run 'ranger accounts survey' to see the
# values actually in your vault, then list them here. Empty means tier does
# not affect the morning brief's ranking.
tier_order = []
# Which opportunity stages count as live. Empty means every opportunity counts,
# which is wrong the moment closed deals stay in the CRM export. The survey
# lists the stages actually present.
open_stages = []

[brief]
# Tier 5. A morning brief has a size, not a threshold.
#
# accounts.quiet_after_days decides what is eligible. These decide what gets
# read. With 58 accounts a plain threshold produced 41 lines sorted by how
# thoroughly each account had been abandoned, topped by one at 215 days, which
# is the list least likely to be acted on.
#
# Hard cap on the whole brief.
lines = 5
# Accounts that crossed the threshold since the last brief. The only genuinely
# new information in the report: an account quiet 25, then 26, then 27 days is
# the same fact three times.
slipping_max = 3
# Past the threshold with a live opportunity, ranked by tier then recency.
deals_max = 3
# Past this an account is not lapsing, it has lapsed. Cold accounts never
# appear in the daily buckets. Capital equipment runs a twelve to eighteen
# month cycle, so quiet since March is mid-cycle and not dead, which is why
# they come back as a question rather than being dropped.
cold_after_days = 90
# Close the brief with one cold account and ask whether it should keep
# appearing. This drains the backlog one decision at a time instead of
# reprinting it every morning.
decision_prompt = true
# Both relative to the Ranger folder in the vault. They live there rather than
# in the account notes because scripts/build_vault.py regenerates those from
# the CRM export and would wipe anything written into them.
seen_file = "quiet-seen.md"
dormant_file = "dormant.md"

[recall]
# Account notes run to about 25,000 characters. Recall returns a digest, never
# the note, so a single question cannot swallow the whole turn.
activities = 5
detail_activities = 20
section_chars = 400
body_chars = 300
max_chars = 4000

[drafts]
# Tier 2 "draft and hold". Ranger writes here and never sends.
filename_format = "{date}-{slug}.md"

[voice]
push_to_talk = true
wake_word = false        # never, until everything else is stable

# How recording starts and stops.
#   "hold"   hold the key, release to send. Needs pynput. The default.
#   "toggle" Enter to start, Enter to send. Standard library, cannot fail.
trigger = "hold"
key = "space"

# Devices. Prefer a name fragment over an index: indices shuffle when a USB mic
# is plugged in or a headset connects, and a stale index silently records from
# the wrong thing. Empty means the Windows default.
# Run 'ranger audio devices' to see the list.
input_device = ""
output_device = ""

# 16k mono is what Deepgram wants and it keeps uploads small. If the device
# refuses it, 48000 almost always works.
sample_rate = 16000
channels = 1
# Hard ceiling on one recording, so a stuck key cannot record all afternoon.
max_seconds = 60

# The voice itself lives in [tts], not here.

[stt]
# Speech to text. Deepgram's pre-recorded endpoint, one POST per utterance.
provider = "deepgram"
# nova-3 takes keyterm prompting; nova-2 and earlier take keyword boosting.
# The code picks the right parameter from this name, so change only this.
# nova-3 costs more per minute than nova-2. Check the Deepgram pricing page
# before leaving it here; this was not verified when it was written.
model = "nova-3"
language = "en"
smart_format = true
punctuate = true
timeout_seconds = 30.0

# Vocabulary hints. These are the words a general model gets wrong: named
# accounts and packaging terms. Empty this list to turn hinting off entirely,
# which is also how to A/B whether it is earning its keep.
keyterms = [
  "Wexxar", "Pregis", "Illes", "Pegasus", "CaptiveAire", "Amcor", "Vytalogy",
  "corrugated", "case erector", "stretch wrapper", "Texoma",
]
# Also hint the account names, taken from the filenames in Accounts/ so the
# list never goes stale. Distinctive words only: a token has to be at least
# four letters, not a generic business word, and appear in exactly one account
# name. They are ranked by recency of activity, because that is what predicts
# what you are about to say, and cut at max_hints.
# Run 'ranger keyterms' to see exactly what would be sent.
keyterms_from_accounts = true

# Intensifier, keyword boosting only. Keyterm prompting ignores it.
boost = 2.0
# Deepgram's real keyterm limit is not documented here because it could not be
# verified from the sandbox. If this is above their limit the request comes
# back 400 and the error names the parameter. Lower it if that happens.
# More hints may also cost latency, which matters more than coverage here.
max_hints = 100

[tts]
# Text to speech. ElevenLabs, streaming, plain HTTP.
provider = "elevenlabs"
# Run 'ranger voices' to list what the account has, then paste an id here.
voice_id = ""
# Flash or Turbo. Latency is the whole experience with push to talk.
model_id = "eleven_flash_v2_5"
# pcm_24000 plays straight through with no decoder at all. If the plan refuses
# it the request comes back 422 and says so; mp3_44100_128 works everywhere and
# needs soundfile to decode.
output_format = "pcm_24000"
# Leave these alone until a voice has been chosen unmodified. Tuning a bad
# match wastes more time than picking a better voice.
stability = 0.5
similarity_boost = 0.75
speed = 1.0
timeout_seconds = 30.0

[gate]
# The hard confirmation gate. Every consequential action stops here and waits
# for an explicit yes, every time. Approving one never pre-authorises the next
# and there is no blanket allow.
#
# Nothing may hang: an action nobody answers inside this resolves to held, a
# notice goes to Ranger/inbox/, and the loop carries on.
timeout_seconds = 120.0
# A spoken yes is not consent. In voice mode the action is held for approval at
# a keyboard. This cannot be turned off.
voice_holds = true

[heartbeat]
# The loop that lets Ranger act without being spoken to. Quiet by default:
# notices go to Ranger/inbox/ as markdown and nothing interrupts.
#
# There is no schedule file. The inbox is the schedule: whether the morning
# surface has run today is answered by whether today's notice exists. So a
# restart cannot lose the schedule, a laptop asleep at 07:00 catches up when it
# wakes, and coming back after a week does not replay six mornings.
enabled = true
# How often the loop wakes. Checks decide whether they are due, so this only
# bounds how late a catch-up can be.
interval_seconds = 300
# Nothing waits on a person. A check that runs longer than this is stopped and
# leaves a note saying so.
check_timeout_seconds = 120

[server]
# Tier 7. The browser talks to the same core the terminal does.
host = "127.0.0.1"
port = 8765
