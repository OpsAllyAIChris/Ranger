<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ranger orb</title>
<style>
  :root {
    --bg: #0E0F13;
    --accent: #2DD4A8;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }
  #scene {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
  }
  /* Shown until the scene boots. If the CDN is unreachable this is what you
     get instead of a black rectangle you have to guess about. */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    place-content: center;
    text-align: center;
    font: 13px/1.7 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(255, 255, 255, 0.55);
    padding: 24px;
  }
  #boot b { color: var(--accent); font-weight: 600; }
  #boot code {
    font-family: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
    color: rgba(255, 255, 255, 0.8);
  }
  #boot.failed { color: rgba(255, 180, 180, 0.85); }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="boot">loading three.js from the CDN&hellip;</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  const boot = document.getElementById('boot');
  const fail = (why) => {
    boot.classList.add('failed');
    boot.innerHTML =
      '<b>The orb could not start.</b><br>' + why + '<br><br>' +
      'three.js is loaded from a CDN, so this page needs the network.<br>' +
      'If you opened the file directly and nothing loads, serve it instead:<br>' +
      '<code>python -m http.server -d prototypes 8000</code><br>' +
      'then open <code>http://localhost:8000/orb.html</code>';
  };
  window.addEventListener('error', (e) => {
    if (String(e.message).includes('__handled__')) return;
    fail(String(e.message || e.error || e));
  });

  let THREE, EffectComposer, RenderPass, UnrealBloomPass;
  try {
    THREE = await import('three');
    ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
    ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
    ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
  } catch (err) {
    // Reported on screen, not rethrown: an uncaught error here adds console
    // noise and tells the operator nothing the overlay has not already said.
    fail(String(err && err.message ? err.message : err));
    throw new Error('__handled__');
  }

  // ---------------------------------------------------------------- setup

  const BG = 0x0E0F13;
  const ACCENT = new THREE.Color('#2DD4A8');
  const canvas = document.getElementById('scene');

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(BG, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
  camera.position.z = 14;

  // One clock, one shared brightness. Everything that glows reads these.
  const uniforms = {
    uTime: { value: 0 },
    // 0.0 to 1.0. Tier 7 drives this from playback amplitude; until then it
    // only breathes.
    uVoiceBright: { value: 0.0 },
  };

  // ------------------------------------------------------------- nebula
  // Layered fractal noise rather than radial gradients: gradients band badly
  // on a dark background, and noise drifts without repeating.

  const NOISE = `
    vec2 hash2(vec2 p) {
      p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
      return -1.0 + 2.0 * fract(sin(p) * 43758.5453123);
    }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0)),
                     dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
                 mix(dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)),
                     dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.02; a *= 0.5; }
      return v;
    }
  `;

  const nebula = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.ShaderMaterial({
      depthTest: false,
      depthWrite: false,
      uniforms: { uTime: uniforms.uTime, uAspect: { value: 1 } },
      vertexShader: `
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
      `,
      fragmentShader: `
        precision highp float;
        varying vec2 vUv;
        uniform float uTime;
        uniform float uAspect;
        ${NOISE}
        void main() {
          vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0) * 3.0;
          float t = uTime * 0.012;

          // Three wisps drifting at different rates so they never lock up.
          float teal   = fbm(p * 1.1 + vec2( t * 1.7,  t * 0.9));
          float purple = fbm(p * 0.8 + vec2(-t * 1.1,  t * 1.4) + 11.0);
          float blue   = fbm(p * 1.4 + vec2( t * 0.6, -t * 1.2) + 23.0);

          vec3 col = vec3(0.0);
          col += vec3(0.176, 0.831, 0.659) * smoothstep(0.05, 0.65, teal)   * 0.15;
          col += vec3(0.42,  0.29,  0.85)  * smoothstep(0.10, 0.70, purple) * 0.13;
          col += vec3(0.18,  0.38,  0.80)  * smoothstep(0.10, 0.70, blue)   * 0.11;

          // Darker at the edges so the middle of the frame carries the eye.
          float vignette = 1.0 - smoothstep(0.35, 1.15, length(vUv - 0.5) * 2.0);
          gl_FragColor = vec4(col * vignette, 1.0);
        }
      `,
    })
  );
  nebula.frustumCulled = false;
  nebula.renderOrder = -2;
  scene.add(nebula);

  // ----------------------------------------------------------- starfield

  const STAR_COUNT = 1400;
  const starPos = new Float32Array(STAR_COUNT * 3);
  const starPhase = new Float32Array(STAR_COUNT);
  const starSize = new Float32Array(STAR_COUNT);
  for (let i = 0; i < STAR_COUNT; i++) {
    starPos[i * 3 + 0] = (Math.random() - 0.5) * 90;
    starPos[i * 3 + 1] = (Math.random() - 0.5) * 60;
    starPos[i * 3 + 2] = -12 - Math.random() * 55;
    starPhase[i] = Math.random() * Math.PI * 2;
    starSize[i] = 0.6 + Math.random() * 1.9;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhase, 1));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(starSize, 1));

  scene.add(new THREE.Points(starGeo, new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    uniforms: { uTime: uniforms.uTime, uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      attribute float aPhase;
      attribute float aSize;
      uniform float uTime;
      uniform float uPixelRatio;
      varying float vTwinkle;
      void main() {
        // Slow, out of phase, and never fully off.
        vTwinkle = 0.45 + 0.55 * (0.5 + 0.5 * sin(uTime * 0.9 + aPhase));
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * uPixelRatio * (70.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      precision highp float;
      varying float vTwinkle;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float a = pow(max(0.0, 1.0 - d), 2.2) * vTwinkle;
        gl_FragColor = vec4(vec3(0.80, 0.92, 0.98) * a, a);
      }
    `,
  })));

  // ---------------------------------------------------------------- orb
  // Three additive layers: a wide atmospheric bloom, a medium halo, and a
  // bright inner core. The base colours are deliberately restrained; the
  // bloom pass below is what makes it glow. Brightening the material instead
  // gives a flat disc.

  const GLOW_VERT = `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;
  const GLOW_FRAG = `
    precision highp float;
    varying vec2 vUv;
    uniform vec3  uColor;
    uniform float uPower;      // falloff sharpness
    uniform float uIntensity;  // base brightness
    uniform float uVoice;      // how much uVoiceBright lifts this layer
    uniform float uVoiceBright;
    uniform float uPulse;
    void main() {
      float d = length(vUv - 0.5) * 2.0;
      float a = pow(max(0.0, 1.0 - d), uPower);
      float lift = 1.0 + uVoice * uVoiceBright + uPulse;
      gl_FragColor = vec4(uColor * a * uIntensity * lift, a * min(1.0, uIntensity * lift));
    }
  `;

  const orb = new THREE.Group();
  scene.add(orb);

  const layer = ({ size, color, power, intensity, voice }) => {
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(size, size),
      new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uColor: { value: color },
          uPower: { value: power },
          uIntensity: { value: intensity },
          uVoice: { value: voice },
          uVoiceBright: uniforms.uVoiceBright,
          uPulse: { value: 0 },
        },
        vertexShader: GLOW_VERT,
        fragmentShader: GLOW_FRAG,
      })
    );
    orb.add(mesh);
    return mesh;
  };

  //                          wide soft atmosphere -> medium halo -> inner core
  const atmosphere = layer({ size: 15.0, color: ACCENT.clone(), power: 2.6, intensity: 0.20, voice: 0.35 });
  const halo       = layer({ size:  6.4, color: ACCENT.clone(), power: 3.2, intensity: 0.55, voice: 0.90 });
  const core       = layer({ size:  2.6, color: new THREE.Color('#B9FFEC'), power: 4.5, intensity: 0.95, voice: 1.30 });

  // --------------------------------------------------------- post-process

  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 1.55, 0.75, 0.0);
  composer.addPass(bloom);

  // ------------------------------------------------------------- resizing

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h, false);
    composer.setSize(w, h);
    bloom.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    nebula.material.uniforms.uAspect.value = w / h;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------------------------------------------------------------- loop

  const clock = new THREE.Clock();
  const PULSE_SECONDS = 4.0;
  let demo = new URLSearchParams(location.search).has('demo');

  function frame() {
    const t = clock.getElapsedTime();
    uniforms.uTime.value = t;

    if (demo) {
      // Something to look at without wiring anything up: a slow sweep of the
      // full range, so the top and bottom of uVoiceBright are both visible.
      uniforms.uVoiceBright.value = 0.5 + 0.5 * Math.sin(t * 1.6);
    }

    // Breathing, so it never looks frozen when nobody is talking. Sine over
    // four seconds, and it fades out as the voice comes up so the two do not
    // fight each other.
    const idle = (0.5 + 0.5 * Math.sin((t / PULSE_SECONDS) * Math.PI * 2)) *
                 0.16 * (1.0 - uniforms.uVoiceBright.value);
    core.material.uniforms.uPulse.value = idle;
    halo.material.uniforms.uPulse.value = idle * 0.7;
    atmosphere.material.uniforms.uPulse.value = idle * 0.35;

    // A touch of drift so the whole frame is never perfectly still.
    orb.position.x = Math.sin(t * 0.11) * 0.10;
    orb.position.y = Math.cos(t * 0.09) * 0.08;

    composer.render();
    requestAnimationFrame(frame);
  }

  boot.remove();
  frame();

  // The seam Tier 7 will drive. Deliberately the only thing exposed: no UI in
  // this step, so there is nothing on screen to click.
  window.rangerOrb = {
    setVoiceBright(v) {
      demo = false;
      uniforms.uVoiceBright.value = Math.max(0, Math.min(1, Number(v) || 0));
    },
    getVoiceBright: () => uniforms.uVoiceBright.value,
    setBloom(strength) { bloom.strength = Number(strength); },
    demo(on = true) { demo = !!on; },
  };
  </script>
</body>
</html>
