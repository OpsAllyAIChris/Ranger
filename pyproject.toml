[project]
name = "ranger"
version = "0.1.0"
description = "A voice-first assistant that knows the accounts, remembers what it is told, and drafts what needs sending."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
ranger = "ranger.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ranger"]

# The browser front end ships with the package, so a non-editable install still
# has a face. Paths, not a glob, would miss the vendored three.js tree.
[tool.setuptools.package-data]
ranger = ["web/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
