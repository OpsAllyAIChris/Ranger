<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ranger</title>
<!-- Inline, so the page makes no request the server has to answer with a 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%232DD4A8'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232DD4A8' stroke-opacity='.35' stroke-width='2'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0E0F13;
    --surface: #16171D;
    --accent: #2DD4A8;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --ui: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--ui);
  }
  #scene { position: fixed; inset: 0; z-index: 1; display: block; }

  /* Shown until the scene boots. If something fails to load this is what you
     get instead of a black rectangle you have to guess about. */
  #boot {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: grid;
    place-content: center;
    text-align: center;
    font: 13px/1.7 var(--ui);
    color: rgba(255, 255, 255, 0.55);
    padding: 24px;
    transition: opacity 400ms var(--ease);
  }
  #boot b { color: var(--accent); font-weight: 600; }
  #boot code { font-family: var(--mono); color: rgba(255, 255, 255, 0.8); }
  #boot.failed { color: rgba(255, 180, 180, 0.85); }

  /* ?debug only. Numbers, not decoration: this is how you tell a slow machine
     from a broken one without opening devtools. */
  #debug {
    position: fixed;
    top: 12px;
    left: 14px;
    z-index: 2;
    font: 11px/1.7 var(--mono);
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.04em;
    white-space: pre;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="boot">starting&hellip;</div>
  <div id="debug" hidden></div>

  <!-- three.js is vendored under web/vendor/three, not fetched from a CDN.
       See that folder's README for why. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>

  <script type="module">
  const boot = document.getElementById('boot');
  const fail = (why) => {
    boot.classList.add('failed');
    boot.innerHTML =
      '<b>The orb could not start.</b><br>' + why + '<br><br>' +
      'This page needs WebGL and it needs to be served over http, not opened<br>' +
      'as a file, because it loads JavaScript modules. Start it with:<br>' +
      '<code>ranger ui</code>';
  };
  window.addEventListener('error', (e) => {
    if (String(e.message).includes('__handled__')) return;
    fail(String(e.message || e.error || e));
  });

  let createOrb;
  try {
    ({ createOrb } = await import('./orb.js'));
  } catch (err) {
    // Reported on screen, not rethrown: an uncaught error here adds console
    // noise and tells the operator nothing the overlay has not already said.
    fail(String(err && err.message ? err.message : err));
    throw new Error('__handled__');
  }

  let orb;
  try {
    orb = createOrb(document.getElementById('scene'));
  } catch (err) {
    fail(String(err && err.message ? err.message : err));
    throw new Error('__handled__');
  }

  const params = new URLSearchParams(location.search);
  if (params.has('demo')) orb.demo(true);
  if (params.has('voice')) orb.setVoiceBright(params.get('voice'));

  if (params.has('debug')) {
    const panel = document.getElementById('debug');
    panel.hidden = false;
    let last = 0;
    orb.onFrame = ({ time, fps, voiceBright, target }) => {
      if (time - last < 0.25) return;
      last = time;
      panel.textContent =
        `fps           ${fps.toFixed(0).padStart(3)}\n` +
        `uVoiceBright  ${voiceBright.toFixed(3)}\n` +
        `target        ${target.toFixed(3)}`;
    };
  }

  // The seam Tier 7b drives, and the only thing this page exposes. There is
  // nothing on screen to click, because there is no interface yet.
  window.rangerOrb = orb;

  // Same seam without needing a reference, for the shell in 7c:
  //   window.dispatchEvent(new CustomEvent('ranger:voice-bright', {detail: 0.7}))
  window.addEventListener('ranger:voice-bright', (e) => orb.setVoiceBright(e.detail));

  boot.style.opacity = '0';
  setTimeout(() => boot.remove(), 420);
  </script>
</body>
</html>
