<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ranger</title>
<!-- Inline, so the page makes no request the server has to answer with a 404. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%232DD4A8'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%232DD4A8' stroke-opacity='.35' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./shell.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <header id="header">
      <div class="mark"><span class="mark-dot"></span>Ranger</div>
      <div class="header-right">
        <button class="ghost" id="toggle-frames" aria-pressed="false" title="raw frames">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="8 6 3 12 8 18" /><polyline points="16 6 21 12 16 18" />
          </svg>
        </button>
        <button class="ghost" id="toggle-panel" aria-pressed="true" title="activity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" /><line x1="15" y1="4" x2="15" y2="20" />
          </svg>
        </button>
        <span id="status" data-state="idle" title="idle"></span>
      </div>
    </header>

    <div id="cards"></div>

    <aside id="panel"></aside>

    <pre id="frames" hidden></pre>

    <div id="micbar">
      <button id="mic" data-state="idle" hidden
              title="click to talk, or hold space" aria-label="microphone">
        <span class="ring"></span>
        <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3" />
          <path d="M5 11a7 7 0 0 0 14 0" />
          <line x1="12" y1="18" x2="12" y2="22" />
        </svg>
        <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="7" y="7" width="10" height="10" rx="1.5" />
        </svg>
      </button>
      <div id="mic-hint">hold space to talk</div>
    </div>

    <div id="composer">
      <input id="say" autocomplete="off" spellcheck="false"
             placeholder="type a turn and press enter" />
    </div>

    <div id="toast"></div>
  </div>

  <!-- Outside #ui so it covers everything, including the panel and the cards.
       While the microphone is open this is the unmissable part. -->
  <div id="live-edge"></div>

  <!-- Outside #ui, because a confirmation is not part of the furniture. It
       covers everything and it is answered rather than dismissed. -->
  <div id="confirm" hidden></div>

  <div id="boot">starting&hellip;</div>

  <!-- three.js is vendored under web/vendor/three, not fetched from a CDN.
       See that folder's README for why. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>

  <script type="module">
  const boot = document.getElementById('boot');
  const fail = (why) => {
    boot.classList.add('failed');
    boot.innerHTML =
      '<b>Ranger could not start.</b><br>' + why + '<br><br>' +
      'This page needs WebGL and it needs to be served over http, not opened<br>' +
      'as a file, because it loads JavaScript modules. Start it with:<br>' +
      '<code>ranger ui</code>';
  };
  window.addEventListener('error', (e) => {
    if (String(e.message).includes('__handled__')) return;
    fail(String(e.message || e.error || e));
  });

  let createOrb, createShell, orb;
  try {
    ({ createOrb } = await import('./orb.js'));
    ({ createShell } = await import('./shell.js'));
  } catch (err) {
    fail(String(err && err.message ? err.message : err));
    throw new Error('__handled__');
  }

  try {
    orb = createOrb(document.getElementById('scene'));
  } catch (err) {
    // The shell is the useful half. If WebGL is unavailable, say so and carry
    // on without a scene rather than losing the interface as well.
    console.warn('the orb did not start:', err);
    orb = null;
  }

  const params = new URLSearchParams(location.search);
  if (orb && params.has('demo')) orb.demo(true);
  if (orb && params.has('voice')) orb.setVoiceBright(params.get('voice'));

  const shell = createShell(orb);

  // The seams 7d drives. Deliberately the only globals.
  window.rangerOrb = orb;
  window.rangerShell = shell;
  window.addEventListener('ranger:voice-bright', (e) => orb && orb.setVoiceBright(e.detail));

  boot.style.opacity = '0';
  setTimeout(() => boot.remove(), 440);
  </script>
</body>
</html>
